[pytest]
testpaths = tests
pythonpath = . tests
addopts = -q --durations=8
filterwarnings =
    ignore::DeprecationWarning
# Tests render real audio into tmp_path; keeping every run's renders filled the
# owner's disk (4 GB in a week). Keep only the most recent failing run.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
