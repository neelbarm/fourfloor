[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourfloor"
version = "0.1.0"
description = "Turn any song into a house remix, with a session file a DJ app can beat-match and cue against."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Neel Barmecha" }]
requires-python = ">=3.11"
keywords = ["audio", "dsp", "house", "remix", "dj", "beat-tracking", "phase-vocoder"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Neural four-way stem separation. Pulls torch (~900 MB installed) and
# downloads the htdemucs weights on first run.
stems = ["demucs>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
fourfloor = "fourfloor.cli:main"

[project.urls]
Homepage = "https://github.com/neelbarmecha/fourfloor"
Issues = "https://github.com/neelbarmecha/fourfloor/issues"

[tool.setuptools.packages.find]
include = ["fourfloor*"]

[tool.setuptools.package-data]
fourfloor = ["py.typed"]
